proxy_cache_path /var/cache/nginx/api
    levels=1:2
    keys_zone=api_cache:10m
    max_size=100m
    inactive=10m
    use_temp_path=off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    application/json
    application/javascript;

upstream api_main_backend {
    server api:8080;
}

upstream api_get_backend {
    server api:8080 weight=2;
    server api-read-1:8081 weight=1;
    server api-read-2:8082 weight=1;
}

map $request_method $backend {
    GET     http://api_get_backend;
    default http://api_main_backend;
}

map $uri $no_cache {
    ~^/api/v1/swagger 1;
    default 0;
}

server {
    listen 80;
    server_name shop.local;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name shop.local;

    ssl_certificate /etc/nginx/certs/shop.local.crt;
    ssl_certificate_key /etc/nginx/certs/shop.local.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    location = /status {
        stub_status;
        access_log off;

        allow all;
    }

    location = / {
        try_files $uri $uri/ =404;
    }

    location = /api {
        return 301 /api/v1;
    }

    location = /api/v1 {
        return 302 /api/v1/swagger/index.html;
    }

    location /admin/ {
        proxy_pass http://pgadmin:80/;
        proxy_redirect off;

        proxy_http_version 1.1;

        proxy_set_header X-Script-Name /admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location /api/v1/ {
        proxy_pass $backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_cache_methods GET;
        proxy_cache api_cache;

        proxy_cache_bypass $no_cache;
        proxy_no_cache $no_cache;

        proxy_cache_valid 200 302 30s;
        proxy_cache_valid 404 5s;

        add_header X-Proxy-Cache $upstream_cache_status;
        add_header X-Upstream-Addr $upstream_addr;
    }
}