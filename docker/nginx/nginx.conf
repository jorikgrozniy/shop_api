upstream api_main_backend {
    server api:8080;
}

upstream api_get_backend {
    server api:8080 weight=2;
    server api-read-1:8081 weight=1;
    server api-read-2:8082 weight=1;
}

map $request_method $backend {
    GET     http://api_get_backend;
    default http://api_main_backend;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 20M;

    root /usr/share/nginx/html;
    index index.html;

    location = /status {
        stub_status;
        access_log off;

        allow all;
    }

    location = / {
        try_files $uri $uri/ =404;
    }

    location = /api {
        return 301 /api/v1;
    }

    location = /api/v1 {
        return 302 /api/v1/swagger/index.html;
    }

    location /admin/ {
        proxy_pass http://pgadmin:80/;
        proxy_redirect off;

        proxy_http_version 1.1;

        proxy_set_header X-Script-Name /admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        proxy_pass $backend;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}