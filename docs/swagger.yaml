        type: integer
      - default: 0
        description: Offset
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.SupplierListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Get suppliers with params
      tags:
      - suppliers
    post:
      consumes:
      - application/json
      description: Create new supplier
      parameters:
      - description: Supplier data
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.SupplierRequest'
      produces:
